# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config
bind \` source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Options
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0
set -g history-limit 50000
set -g display-time 2500
set -g focus-events on
setw -g aggressive-resize on

# Search keymaps
if-shell "command -v fzf >/dev/null 2>&1" \
  "bind -N 'Search key bindings' ? display-popup -E 'tmux list-keys -N | fzf --ansi'" \
  ""

# Sessions
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" Q run-shell 'tmux switch-client -p \; kill-session -t "#{session_name}"'
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n

# Windows
bind -N "Rename window" r command-prompt -I "#S" "rename-window -- '%%'"
bind -N "Kill window" q kill-window
bind -N "Previous window" C-p previous-window
bind -N "Next window" C-n next-window
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -n C-S-Left swap-window -t -1\; select-window -t -1
bind -n C-S-Right swap-window -t +1\; select-window -t +1


# Panes
bind -N "Select left pane" h select-pane -L
bind -N "Select lower pane" j select-pane -D
bind -N "Select upper pane" k select-pane -U
bind -N "Select right pane" l select-pane -R
bind -N "Resize pane left"  -r H resize-pane -L 5
bind -N "Resize pane down"  -r J resize-pane -D 5
bind -N "Resize pane up"    -r K resize-pane -U 5
bind -N "Resize pane right" -r L resize-pane -R 5

# Status bar
set -g status-position top
set -g status-left '#[fg=colour245] #S#{?client_prefix, #[fg=default]󰘳 ,  }'
set -g status-right "#[fg=colour245]󰍹 #H"
set -g status-justify centre
set -g status-style fg=default,bg=default
set -g message-style fg=default,bg=default
set -g window-status-style "fg=colour240"
set -g window-status-current-style "fg=default,bold"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Run TPM
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins'
if "test ! -d ~/.local/share/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.local/share/tmux/plugins/tpm && ~/.local/share/tmux/plugins/tpm/bin/install_plugins'"
run "~/.local/share/tmux/plugins/tpm/tpm"
