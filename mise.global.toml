# Dotfiles-specific mise configuration applied globally.
# Keep global settings required by this repo here.
# config/mise/config.toml is for independent personal configuration.

[env]
_.path = ["{{ config_source | canonicalize | dirname }}/bin"]
SSH_ASKPASS = "{{ config_source | canonicalize | dirname }}/scripts/ssh-askpass.bash"
SSH_ASKPASS_REQUIRE = "force"
